<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 1.2 Review Site</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: single reading column, sticky section nav, cards only for questions */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --fg:#17212e; --muted:#5a6676; --line:#d9dfe7;
  --accent:#1f7a4d; --accent-ink:#ffffff; --accent-soft:#e3edfb;
  --warn:#9a5b00; --good:#17703f; --good-soft:#e1f4e8; --bad:#a3302a; --bad-soft:#fbe7e5; --warn-soft:#fff3d6;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151d; --surface:#18212c; --fg:#e8edf3; --muted:#9aa7b6; --line:#2b3745;
  --accent:#7db0ff; --accent-ink:#0b1420; --accent-soft:#1b2c45;
  --warn:#f0b955; --good:#6fd39a; --good-soft:#143323; --bad:#ff9a92; --bad-soft:#3a1c1a; --warn-soft:#3a3016;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151d; --surface:#18212c; --fg:#e8edf3; --muted:#9aa7b6; --line:#2b3745;
  --accent:#7db0ff; --accent-ink:#0b1420; --accent-soft:#1b2c45;
  --warn:#f0b955; --good:#6fd39a; --good-soft:#143323; --bad:#ff9a92; --bad-soft:#3a1c1a; --warn-soft:#3a3016;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:18px/1.55 var(--font-body);margin:0;
  padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
header.top{padding-block:32px 8px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:clamp(1.9rem,6vw,2.7rem);margin-top:6px}
.lede{color:var(--muted);margin:10px 0 0}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  margin-top:18px;display:flex;gap:4px;overflow-x:auto;padding-block:8px}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-weight:600;font-size:.95rem}
nav.tabs a:hover,nav.tabs a:focus-visible{background:var(--accent-soft);color:var(--accent);outline:none}
.meter{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:.95rem;color:var(--muted)}
.meter .bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:var(--good);transition:width .3s}
section{padding-top:40px}
section>h2{font-size:1.6rem;margin-bottom:6px}
section>p.sub{color:var(--muted);margin:0 0 18px}
.ideas{display:grid;gap:14px;counter-reset:idea;padding:0;list-style:none;margin:0}
.ideas li{counter-increment:idea;display:grid;grid-template-columns:2.2rem 1fr;gap:12px}
.ideas li::before{content:counter(idea);font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:var(--accent);
  background:var(--accent-soft);border-radius:8px;height:2.2rem;display:grid;place-items:center}
.ideas b{font-family:var(--font-display)}
.eq{background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-top:6px;font-weight:600;overflow-x:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:92px}
.card:focus-visible{outline:3px solid var(--accent)}
.card .t{font-family:var(--font-display);font-weight:700;display:block}
.card .d{display:none;color:var(--muted);font-size:.95rem;margin-top:4px}
.card.open{background:var(--accent-soft);border-color:var(--accent)}
.card.open .d{display:block}
.card .hint{font-size:.8rem;color:var(--muted)}
.card.open .hint{display:none}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.q .tag{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.q .stem{margin:4px 0 10px}
.q .ctx{background:var(--bg);border-left:4px solid var(--accent);padding:8px 12px;margin:0 0 10px;border-radius:0 8px 8px 0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;margin-bottom:8px}
.row .l{font-weight:600}
.row select{font:inherit;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
.row select.right{border-color:var(--good);background:var(--good-soft)}
.row select.wrong{border-color:var(--bad);background:var(--bad-soft)}
@media(max-width:520px){.row{grid-template-columns:1fr;gap:4px}}
button.go{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:9px 18px;cursor:pointer;margin-top:10px}
button.go.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
button.go:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{margin-top:10px;padding:10px 12px;border-radius:9px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--good-soft);color:var(--fg);border-left:4px solid var(--good)}
.fb.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.fb b.s{display:block}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;padding:0;list-style:none}
.flow li{background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-weight:600;font-size:.95rem}
.flow li.arrow{background:none;padding:0;color:var(--muted)}
figure{margin:0 0 6px;overflow-x:auto}
figure svg{width:100%;height:auto;min-width:520px;display:block}
figcaption{font-size:.9rem;color:var(--muted)}
textarea{width:100%;min-height:120px;font:inherit;padding:10px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
.frames{font-size:.95rem;color:var(--muted);margin:0 0 8px;padding-left:1.2rem}
.chk{display:grid;gap:6px;margin:10px 0 0}
.chk label{display:flex;gap:10px;align-items:flex-start}
.chk input{margin-top:6px;accent-color:var(--accent)}
.sample{display:none;margin-top:10px;background:var(--warn-soft);padding:10px 12px;border-radius:9px}
.sample.show{display:block}
table.rubric{border-collapse:collapse;width:100%;font-size:.95rem}
table.rubric td,table.rubric th{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.ready{list-style:none;padding:0;display:grid;gap:8px}
.ready label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ready input{margin-top:6px;accent-color:var(--accent);width:18px;height:18px}
.done-msg{display:none;margin-top:14px;padding:14px;border-radius:10px;background:var(--good-soft);border:1px solid var(--good)}
.done-msg.show{display:block}
footer{margin-top:48px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* class snapshot + grouped practice */
.stats{display:flex;flex-wrap:wrap;gap:10px 24px;margin:0 0 18px}
.stats div{min-width:0}.stats b{font-family:var(--font-display);font-size:1.6rem;display:block;line-height:1.1}.stats span{font-size:.85rem;color:var(--muted)}
.bars{display:grid;gap:8px;margin:0 0 18px;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:minmax(0,11rem) 1fr 3rem;gap:10px;align-items:center;font-size:.95rem}
.bars .nm{line-height:1.25}
.bars .tr{height:16px;background:var(--line);border-radius:4px;overflow:hidden}
.bars .tr i{display:block;height:100%}
.bars .pc{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.t-low{background:var(--bad)}.t-mid{background:var(--warn)}.t-hi{background:var(--good)}
.legend{font-size:.85rem;color:var(--muted);margin:-8px 0 18px}
@media(max-width:520px){.bars li{grid-template-columns:1fr 3rem}.bars .tr{grid-column:1 / -1;grid-row:2}}
.prio{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.prio h3{font-size:1.1rem}.prio .rk{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--bad);font-weight:700}
.prio table{border-collapse:collapse;width:100%;font-size:.92rem;margin-top:8px}
.prio td,.prio th{border-top:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.prio td.n{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.prio .wr{color:var(--muted);font-size:.88rem}
details.grp{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
details.grp>summary{cursor:pointer;padding:12px 16px;display:grid;gap:2px;list-style:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
details.grp .gt{font-family:var(--font-display);font-weight:700;font-size:1.15rem}
details.grp .gs{font-size:.88rem;color:var(--muted)}
details.grp>summary::after{content:"Show";justify-self:start;font-size:.8rem;font-weight:700;color:var(--accent)}
details.grp[open]>summary::after{content:"Hide"}
details.grp>.q,details.grp>.teach{margin:0 12px 12px}
.teach{background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.teach .fix{margin-top:8px}
.scroll{overflow-x:auto}

</style>
</head>

<script>window.UNIT={"code": "HS-LS2-5", "eyebrow": "Unit 1.2 \u00b7 HS-LS2-5", "title": "Cell Energy & Carbon", "lede": "Review before your reassessment. Work top to bottom, or jump to the part you missed.", "footer": "Living Earth (Biology) \u00b7 Unit 1.2 review. Your progress saves in this browser.", "ideas": [{"t": "Photosynthesis moves carbon into living things.", "d": "Plants and algae take in carbon dioxide and water. They use light energy to build sugar (glucose) and release oxygen.", "eq": "CO\u2082 + H\u2082O + light energy \u2192 glucose + O\u2082"}, {"t": "Cellular respiration releases it again.", "d": "Cells break down glucose with oxygen to get usable energy (ATP). Carbon dioxide and water are given off. Plants, animals, and decomposers all do this.", "eq": "glucose + O\u2082 \u2192 CO\u2082 + H\u2082O + usable energy"}, {"t": "Plants do both processes.", "d": "Plants do photosynthesis when there is light, and cellular respiration all the time. In sunlight, photosynthesis is usually faster, so a plant takes in more CO\u2082 than it gives off."}, {"t": "Carbon moves between four spheres.", "d": "<b>Atmosphere<\/b> (air), <b>biosphere<\/b> (living things), <b>hydrosphere<\/b> (water), <b>geosphere<\/b> (rock, soil, fossil fuels). Photosynthesis, respiration, decomposition, burning (combustion), and dissolving in water move it."}, {"t": "Matter cycles. Energy flows.", "d": "The same carbon atoms are used again and again. Energy comes in as sunlight, is used or lost as heat, and is not recycled. Atoms are never created or destroyed. They are rearranged."}, {"t": "In a model, an arrow shows carbon moving.", "d": "Ask: where does the arrow start, where does it end, and what process moves the carbon?"}], "vocab": [["atmosphere", "The air around Earth. Carbon is there as carbon dioxide gas."], ["biosphere", "All the living things on Earth."], ["hydrosphere", "All the water on Earth: oceans, lakes, rivers, ice."], ["geosphere", "The solid parts of Earth: rock, soil, and fossil fuels."], ["photosynthesis", "Plants use sunlight to turn carbon dioxide and water into sugar and oxygen."], ["cellular respiration", "Cells break down sugar with oxygen to get energy, and give off carbon dioxide."], ["combustion", "Burning. Burning wood or fossil fuels gives off carbon dioxide."], ["decomposer", "Fungi and bacteria that break down dead things and return carbon to air and soil."], ["fossil fuel", "Coal, oil, or gas made from living things that died a very long time ago."], ["carbon cycle", "The path carbon takes as it moves between air, water, living things, and rock."], ["glucose", "The sugar plants make. Cells break it down for energy."], ["ATP", "The form of usable energy that cells make and use."]], "vocabQuiz": [{"q": "Match each word to its meaning. Two meanings will not be used.", "tag": "Vocabulary", "pairs": [["Atmosphere", "The air around Earth"], ["Biosphere", "All living things on Earth"], ["Hydrosphere", "All the water on Earth"], ["Geosphere", "Rock, soil, and fossil fuels"], ["Photosynthesis", "Plants use sunlight to make sugar from CO\u2082 and water"], ["Cellular respiration", "Cells break down sugar for energy and give off CO\u2082"], ["Combustion", "Burning something and giving off CO\u2082"], ["Carbon cycle", "The path carbon takes through Earth's spheres"]], "extra": ["Liquid water changes into a gas", "The part of a plant that takes in water"], "why": "All eight of these words matter on the reassessment."}], "practice": [{"q": "A wheat field grows fast in early summer. Which change would a carbon cycle model show?", "opts": ["More carbon moves from the wheat to the air.", "More carbon moves from the air into the wheat.", "Carbon stops moving.", "More carbon moves from the wheat into rock."], "a": 1, "why": "Fast growth means more photosynthesis, which pulls carbon from the air into the plants.", "hint": "Growing plants are building sugar."}, {"q": "A campfire burns a pile of logs. What happens to the carbon in the wood?", "opts": ["It is destroyed.", "It turns into energy and leaves Earth.", "It goes into the air as carbon dioxide.", "It stays in the ash only."], "a": 2, "why": "Burning is combustion. It releases carbon as CO\u2082. Atoms are not destroyed.", "hint": "Think about what burning gives off."}, {"q": "Which statement about plants is correct?", "opts": ["Plants only do photosynthesis.", "Plants only do cellular respiration at night.", "Plants do both photosynthesis and cellular respiration.", "Plants never give off carbon dioxide."], "a": 2, "why": "Plant cells need energy too, so they do cellular respiration all the time.", "hint": "Do plant cells need energy?"}, {"q": "Carbon dioxide from the air dissolves in the ocean. Which two spheres are connected?", "opts": ["Atmosphere and hydrosphere", "Geosphere and biosphere", "Biosphere and atmosphere", "Hydrosphere and geosphere"], "a": 0, "why": "CO\u2082 gas moves from the air (atmosphere) into water (hydrosphere).", "hint": "Where was the CO\u2082 before, and where is it after?"}, {"q": "Coal was made from plants that died millions of years ago. In which sphere is coal stored?", "opts": ["Atmosphere", "Biosphere", "Hydrosphere", "Geosphere"], "a": 3, "why": "Coal is a solid fossil fuel in the ground, so it is part of the geosphere.", "hint": "It is a solid in the ground."}, {"q": "Which statement compares carbon and energy correctly?", "opts": ["Carbon cycles over and over, but energy flows through and is lost as heat.", "Energy cycles and carbon is used up.", "Both carbon and energy are used up.", "Both carbon and energy are recycled in a loop."], "a": 0, "why": "Matter (carbon atoms) is reused. Energy enters as light and leaves as heat.", "hint": "One is matter and one is energy."}, {"q": "A pond fills with leaves in the fall. Bacteria slowly break the leaves down. Where does most of the carbon go?", "opts": ["It disappears.", "It goes into the air and water as CO\u2082 and into the bacteria.", "It becomes sunlight.", "It all stays in the leaves."], "a": 1, "why": "Decomposers do cellular respiration on the leaves. They give off CO\u2082 and use some carbon to build their own bodies.", "hint": "Decomposers break down dead matter."}, {"q": "Which TWO processes ADD carbon dioxide to the atmosphere?", "type": "multi", "opts": ["Photosynthesis", "Cellular respiration", "Combustion of gasoline", "Carbon dioxide dissolving in the ocean", "Plants growing"], "a": [1, 2], "why": "Respiration and burning release CO\u2082. Photosynthesis and ocean uptake remove it.", "hint": "Which two give off CO\u2082?"}, {"type": "match", "q": "Match each photosynthesis or respiration idea to its description. Each is different.", "pairs": [["What photosynthesis takes in", "CO\u2082, water, and light energy"], ["What photosynthesis makes", "Sugar is built and O\u2082 is released"], ["What cellular respiration takes in", "Sugar and O\u2082 are broken down"], ["What cellular respiration gives off", "CO\u2082, water, and usable energy"]], "extra": ["Only light energy"], "why": "They are close to opposites. The outputs of one are the inputs of the other."}, {"type": "match", "q": "Match each sentence to the two spheres the carbon moves between. Two choices will not be used.", "pairs": [["A rabbit eats clover.", "biosphere to biosphere"], ["A kelp forest takes in CO\u2082 dissolved in seawater.", "hydrosphere to biosphere"], ["A power plant burns coal.", "geosphere to atmosphere"], ["CO\u2082 from the air dissolves into a lake.", "atmosphere to hydrosphere"]], "extra": ["atmosphere to geosphere", "biosphere to hydrosphere"], "why": "Say where the carbon starts and where it ends up."}], "model": {"title": "Read the carbon cycle model", "sub": "Each lettered arrow shows carbon moving. Use the arrow's start and end to decide the process.", "caption": "Carbon cycle model. Arrows show carbon moving between spheres. Read the start and the end of each arrow.", "figure": "<svg viewBox=\"0 0 640 380\" role=\"img\" aria-label=\"Carbon cycle model with four spheres and six lettered arrows\">\n<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs>\n<g style=\"color:var(--fg)\" font-family=\"system-ui,sans-serif\" font-size=\"15\">\n<rect x=\"230\" y=\"12\" width=\"180\" height=\"56\" rx=\"10\" fill=\"var(--accent-soft)\" stroke=\"var(--line)\"/><text x=\"320\" y=\"46\" text-anchor=\"middle\" font-weight=\"700\" fill=\"var(--fg)\">Atmosphere (CO\u2082)<\/text>\n<rect x=\"30\" y=\"160\" width=\"180\" height=\"56\" rx=\"10\" fill=\"var(--good-soft)\" stroke=\"var(--line)\"/><text x=\"120\" y=\"193\" text-anchor=\"middle\" font-weight=\"700\" fill=\"var(--fg)\">Biosphere<\/text>\n<rect x=\"430\" y=\"160\" width=\"180\" height=\"56\" rx=\"10\" fill=\"var(--accent-soft)\" stroke=\"var(--line)\"/><text x=\"520\" y=\"193\" text-anchor=\"middle\" font-weight=\"700\" fill=\"var(--fg)\">Hydrosphere<\/text>\n<rect x=\"230\" y=\"310\" width=\"180\" height=\"56\" rx=\"10\" fill=\"var(--warn-soft)\" stroke=\"var(--line)\"/><text x=\"320\" y=\"335\" text-anchor=\"middle\" font-weight=\"700\" fill=\"var(--fg)\">Geosphere<\/text><text x=\"320\" y=\"353\" text-anchor=\"middle\" font-size=\"12\" fill=\"var(--muted)\">rock, soil, coal, oil<\/text>\n<g stroke=\"currentColor\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#ah)\">\n<path d=\"M250 70 C200 95 160 120 140 158\"/>\n<path d=\"M90 158 C100 120 150 80 228 52\"/>\n<path d=\"M390 70 C440 95 480 120 500 158\"/>\n<path d=\"M428 188 L214 188\"/>\n<path d=\"M110 218 C110 290 160 332 228 336\"/>\n<path d=\"M320 308 L320 70\"/>\n<\/g>\n<g font-weight=\"800\" font-size=\"16\" fill=\"var(--accent-ink)\">\n<circle cx=\"188\" cy=\"112\" r=\"14\" fill=\"var(--accent)\"/><text x=\"188\" y=\"118\" text-anchor=\"middle\">A<\/text>\n<circle cx=\"116\" cy=\"106\" r=\"14\" fill=\"var(--accent)\"/><text x=\"116\" y=\"112\" text-anchor=\"middle\">B<\/text>\n<circle cx=\"452\" cy=\"112\" r=\"14\" fill=\"var(--accent)\"/><text x=\"452\" y=\"118\" text-anchor=\"middle\">C<\/text>\n<circle cx=\"370\" cy=\"188\" r=\"14\" fill=\"var(--accent)\"/><text x=\"370\" y=\"194\" text-anchor=\"middle\">D<\/text>\n<circle cx=\"112\" cy=\"290\" r=\"14\" fill=\"var(--accent)\"/><text x=\"112\" y=\"296\" text-anchor=\"middle\">E<\/text>\n<circle cx=\"320\" cy=\"250\" r=\"14\" fill=\"var(--accent)\"/><text x=\"320\" y=\"256\" text-anchor=\"middle\">F<\/text>\n<\/g><\/g><\/svg>", "qs": [{"type": "match", "q": "Match each arrow to what is happening. Two will not be used.", "pairs": [["Arrow A", "Plants take in CO\u2082 by photosynthesis"], ["Arrow B", "Cells give off CO\u2082 by cellular respiration"], ["Arrow C", "CO\u2082 gas dissolves in the ocean"], ["Arrow F", "A power plant burns coal"]], "extra": ["Rain falls on a forest", "Ice melts into a river"], "why": "Check where each arrow starts and ends. A ends in the biosphere, B starts there, C ends in the hydrosphere, F starts in the geosphere."}, {"q": "Cars burn much more gasoline. Which arrow gets bigger?", "opts": ["A", "B", "C", "F"], "a": 3, "why": "Gasoline comes from fossil fuels in the geosphere. Burning it sends CO\u2082 to the atmosphere (arrow F).", "hint": "Where does gasoline come from, and where does the CO\u2082 go?"}, {"q": "A large algae bloom grows in a lake and takes in dissolved CO\u2082. Which arrow shows this?", "opts": ["D", "B", "C", "E"], "a": 0, "why": "Algae live in water and are living things. Carbon moves from the hydrosphere to the biosphere (arrow D).", "hint": "Start: water. End: living things."}, {"q": "Over millions of years, buried dead organisms become coal and oil. Which arrow shows carbon moving into the geosphere?", "opts": ["E", "A", "F", "C"], "a": 0, "why": "Arrow E goes from living things to the geosphere. Arrow F goes the other way.", "hint": "Look for the arrow that ENDS at the geosphere."}, {"q": "A student says, \u201cCarbon atoms that leave the air in arrow A are gone forever.\u201d What does the model show instead?", "opts": ["Arrows B and F return carbon to the air, so carbon cycles.", "Nothing in the model returns carbon to the air.", "The carbon becomes energy.", "The carbon is destroyed by plants."], "a": 0, "why": "The cycle is a loop. Carbon goes into living things and comes back out."}]}, "rubric": [["4", "Correct and complete. Uses the key science words. Explains every part of the question and connects the ideas."], ["3", "Mostly correct. Connects the ideas but leaves out one piece."], ["2", "Partly correct. Names the parts but does not explain how they connect, or is vague."], ["1", "Has a major mistake or does not answer the question."]], "write": [{"ctx": "A grass field is measured each day. At noon in summer the CO\u2082 in the air just above the field drops. At night it rises.", "q": "Explain what causes the CO\u2082 to drop at noon and rise at night. Use <b>photosynthesis<\/b> and <b>cellular respiration<\/b>.", "frames": ["During the day, the grass \u2026", "At night, the grass \u2026", "The carbon atoms \u2026"], "check": ["I said the grass does photosynthesis in light and takes CO\u2082 from the air.", "I said the grass also does cellular respiration and gives off CO\u2082.", "I explained why the amount rises at night (no light, so only respiration).", "I said where the carbon goes or comes from."], "sample": "During the day, the grass uses light energy to do photosynthesis. It takes CO\u2082 from the air and builds sugar, so the CO\u2082 drops. The grass also does cellular respiration all the time, but photosynthesis is faster in sunlight. At night there is no light, so photosynthesis stops. Respiration keeps going and gives off CO\u2082, so the CO\u2082 rises. The carbon atoms are not destroyed. They move from the air into the grass's sugar and back to the air."}, {"ctx": "A student says: \u201cSunlight energy goes around in a cycle just like carbon does.\u201d", "q": "Is the student correct? Revise the statement so it is correct. Use the words <b>matter<\/b>, <b>energy<\/b>, and <b>heat<\/b>.", "frames": ["The student is \u2026", "Carbon (matter) \u2026", "Energy \u2026"], "check": ["I said the student is not correct.", "I said carbon, which is matter, cycles and is reused.", "I said energy flows through and does not cycle.", "I said energy leaves as heat."], "sample": "The student is not correct. Carbon is matter, so the same atoms cycle between the air, living things, water, and rock. Energy flows instead. It enters as sunlight, plants store some of it in sugar, and cells use it. Most of it leaves as heat, and that heat does not go back into the cycle."}], "ready": ["I can write what goes in and what comes out of photosynthesis and cellular respiration.", "I can explain that plants do both processes.", "I can name the four spheres and say where carbon moves between them.", "I can read an arrow in a carbon cycle model and name the process.", "I can explain why matter cycles but energy flows.", "I can explain a result using photosynthesis and respiration together."]};</script>
<script>
(function(){
const D=window.UNIT, $=(s,r=document)=>r.querySelector(s);
const KEY='review:'+D.code;
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const h=(tag,attrs,html)=>{const e=document.createElement(tag);for(const k in attrs||{}){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k])}if(html!=null)e.innerHTML=html;return e};
let total=0,qid=0;
const meter=h('div',{class:'meter'},'<span id="mtxt"></span><div class="bar"><i id="mbar"></i></div>');
function upd(){const n=Object.keys(saved).filter(k=>saved[k]==='ok').length;$('#mtxt').textContent=n+' of '+total+' correct';$('#mbar').style.width=(total?100*n/total:0)+'%';
  const dm=$('#done');if(dm)dm.classList.toggle('show',n===total&&total>0)}
function feedback(box,ok,why){box.className='fb show '+(ok?'ok':'no');
  box.innerHTML='<b class="s">'+(ok?'Correct.':'Not yet.')+'</b>'+(ok?'':'Look again and try once more. ')+(why?why:'')}
function wrapQ(q,body,tag){const id=D.code+'-q'+(++qid);total++;const box=h('div',{class:'q',id});
  box.appendChild(h('div',{class:'tag'},tag||q.tag||'Practice'));
  if(q.ctx)box.appendChild(h('div',{class:'ctx'},q.ctx));
  box.appendChild(h('div',{class:'stem'},q.q));box.appendChild(body);
  const fb=h('div',{class:'fb',role:'status'});box.appendChild(fb);return {box,fb,id}}
function mc(q,multi){
  const opts=q.opts.map((t,i)=>({t,i,right:multi?q.a.includes(i):q.a===i}));
  const list=h('div',{class:'opts'}),name='n'+(qid+1);
  shuffle(opts).forEach(o=>{const l=h('label',{class:'opt'},'<input type="'+(multi?'checkbox':'radio')+'" name="'+name+'"><span>'+o.t+'</span>');l._o=o;list.appendChild(l)});
  const {box,fb,id}=wrapQ(q,list,multi?'Choose '+q.a.length:null);
  const b=h('button',{class:'go',type:'button'},'Check');box.insertBefore(b,fb);
  b.onclick=()=>{let ok=true;const sel=[...list.children];
    sel.forEach(l=>{const c=l.firstChild.checked;l.classList.remove('right','wrong');
      if(c&&l._o.right)l.classList.add('right');else if(c&&!l._o.right){l.classList.add('wrong');ok=false}else if(!c&&l._o.right)ok=false});
    if(!sel.some(l=>l.firstChild.checked)){fb.className='fb show no';fb.innerHTML='Pick an answer first.';return}
    saved[id]=ok?'ok':'no';save();upd();feedback(fb,ok,ok?q.why:(q.hint||''))
    if(ok)sel.forEach(l=>l.firstChild.disabled=true)};
  if(saved[id]==='ok'){/* progress counted; question stays fresh for re-practice */}
  return box}
function match(q){
  const rights=shuffle(q.pairs.map(p=>p[1]).concat(q.extra||[]));const body=h('div');
  q.pairs.forEach(p=>{const r=h('div',{class:'row'},'<div class="l">'+p[0]+'</div>');
    const s=h('select',{'aria-label':p[0].replace(/<[^>]+>/g,'')},'<option value="">Choose…</option>'+rights.map((t,i)=>'<option value="'+i+'">'+t+'</option>').join(''));
    s._ans=rights.indexOf(p[1]);r.appendChild(s);body.appendChild(r)});
  const {box,fb,id}=wrapQ(q,body,'Match');const b=h('button',{class:'go',type:'button'},'Check');box.insertBefore(b,fb);
  b.onclick=()=>{let ok=true,blank=false;body.querySelectorAll('select').forEach(s=>{s.classList.remove('right','wrong');
    if(s.value===''){blank=true;ok=false;return}if(+s.value===s._ans)s.classList.add('right');else{s.classList.add('wrong');ok=false}});
    if(blank&&ok===false&&!body.querySelector('.wrong')){fb.className='fb show no';fb.innerHTML='Choose an answer for every row.';return}
    saved[id]=ok?'ok':'no';save();upd();feedback(fb,ok,ok?q.why:'Fix the red rows and check again.')};
  return box}
function write(q){
  const body=h('div');
  if(q.frames)body.appendChild(h('ul',{class:'frames'},q.frames.map(f=>'<li>'+f+'</li>').join('')));
  const ta=h('textarea',{id:D.code+'-w'+(++qid),placeholder:'Write your answer here…'});
  try{ta.value=localStorage.getItem(KEY+':'+ta.id)||''}catch(e){}ta.oninput=()=>{try{localStorage.setItem(KEY+':'+ta.id,ta.value)}catch(e){}};
  body.appendChild(ta);qid--;
  body.appendChild(h('div',{class:'tag',style:'margin-top:12px'},'Check your own answer'));
  const chk=h('div',{class:'chk'});q.check.forEach((c,i)=>chk.appendChild(h('label',{},'<input type="checkbox"><span>'+c+'</span>')));body.appendChild(chk);
  const id=D.code+'-q'+(++qid);const box=h('div',{class:'q',id});total++;
  box.appendChild(h('div',{class:'tag'},'Write it'));if(q.ctx)box.appendChild(h('div',{class:'ctx'},q.ctx));
  box.appendChild(h('div',{class:'stem'},q.q));box.appendChild(body);
  const sample=h('div',{class:'sample'},'<b>Sample answer (about a 4)</b><br>'+q.sample);
  const b=h('button',{class:'go alt',type:'button'},'Show a sample answer');b.onclick=()=>{sample.classList.toggle('show')};
  const done=h('button',{class:'go',type:'button'},'I wrote it and checked every box');
  const fb=h('div',{class:'fb',role:'status'});
  done.onclick=()=>{const all=[...chk.querySelectorAll('input')].every(i=>i.checked);
    if(!ta.value.trim()){fb.className='fb show no';fb.textContent='Write your answer first.';return}
    if(!all){fb.className='fb show no';fb.innerHTML='Some boxes are not checked. Add the missing piece to your answer, then check the box. You can look at the sample answer to compare.';return}
    saved[id]='ok';save();upd();fb.className='fb show ok';fb.innerHTML='<b class="s">Nice work.</b>Compare with the sample answer and fix anything you missed.'};
  box.append(done,' ',b,fb,sample);return box}
function sec(id,title,sub){const s=h('section',{id});s.appendChild(h('h2',{},title));if(sub)s.appendChild(h('p',{class:'sub'},sub));return s}

const root=$('#app');
const hd=h('header',{class:'top'},'<div class="eyebrow">'+D.eyebrow+'</div><h1>'+D.title+'</h1><p class="lede">'+D.lede+'</p>');
hd.appendChild(meter);root.appendChild(hd);
const nav=h('nav',{class:'tabs','aria-label':'Sections'});root.appendChild(nav);
const add=(id,t)=>nav.appendChild(h('a',{href:'#'+id},t));

let s;
if(D.pre){s=sec('snapshot',D.preTitle||'Your class','');add('snapshot',D.preNav||'Your class');s.insertAdjacentHTML('beforeend',D.pre);root.appendChild(s)}
s=sec('ideas','Key ideas',D.ideasSub||'Read these first. Then try the practice.');add('ideas','Key ideas');
if(D.figure)s.appendChild(h('figure',{},D.figure+(D.figureCaption?'<figcaption>'+D.figureCaption+'</figcaption>':'')));
const ul=h('ol',{class:'ideas'});D.ideas.forEach(i=>ul.appendChild(h('li',{},'<div><b>'+i.t+'</b> '+i.d+(i.eq?'<div class="eq">'+i.eq+'</div>':'')+'</div>')));
s.appendChild(ul);root.appendChild(s);

if(D.vocab){s=sec('words','Vocabulary','Tap a card to see the meaning. Then say it in your own words.');add('words','Vocabulary');
const cards=h('div',{class:'cards'});D.vocab.forEach(v=>{const c=h('button',{class:'card',type:'button','aria-expanded':'false'},'<span class="t">'+v[0]+'</span><span class="hint">Tap to flip</span><span class="d">'+v[1]+'</span>');
  c.onclick=()=>{const o=c.classList.toggle('open');c.setAttribute('aria-expanded',o)};cards.appendChild(c)});
s.appendChild(cards);(D.vocabQuiz||[]).forEach(q=>s.appendChild(match(q)));root.appendChild(s)}

const mk=q=>q.type==='multi'?mc(q,true):q.type==='match'?match(q):mc(q,false);
s=sec('practice','Practice','Each question tells you right away. Missed one? Read the explanation, then try it again.');add('practice','Practice');
(D.practice||[]).forEach(q=>s.appendChild(mk(q)));
(D.groups||[]).forEach(g=>{const d=h('details',{class:'grp'});if(g.open)d.open=true;d.appendChild(h('summary',{},'<span class="gt">'+g.title+'</span><span class="gs">'+g.sub+'</span>'));
  if(g.teach)d.appendChild(h('div',{class:'teach'},g.teach));g.qs.forEach(q=>d.appendChild(mk(q)));s.appendChild(d)});
root.appendChild(s);

if(D.model){s=sec('model',D.model.title,D.model.sub);add('model','Models');
const fig=h('figure',{},D.model.figure+'<figcaption>'+D.model.caption+'</figcaption>');s.appendChild(fig);
D.model.qs.forEach(q=>s.appendChild(mk(q)));root.appendChild(s)}

s=sec('write','Explain it','Written answers are scored out of 4. Write, check yourself, then compare with the sample.');add('write','Explain it');
const rub=h('div',{class:'scroll'},'<table class="rubric"><tr><th>Score</th><th>What it looks like</th></tr>'+D.rubric.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table>');
s.appendChild(rub);D.write.forEach(q=>s.appendChild(write(q)));root.appendChild(s);

s=sec('ready','Ready check','Check each one only when you can do it without notes.');add('ready','Ready check');
const rl=h('ul',{class:'ready'});D.ready.forEach((t,i)=>{const id=D.code+'-r'+i;const li=h('li',{},'<label><input type="checkbox" id="'+id+'"><span>'+t+'</span></label>');
  const c=li.querySelector('input');c.checked=saved[id]==='1';c.onchange=()=>{saved[id]=c.checked?'1':'';save()};rl.appendChild(li)});
s.appendChild(rl);s.appendChild(h('div',{class:'done-msg',id:'done'},'<b>You answered everything.</b> Take what you got wrong back to your notes, then tell your teacher you are ready to reassess.'));
root.appendChild(s);root.appendChild(h('footer',{},D.footer));
upd();
})();

</script>
</body>
</html>
