<title>Three Sources Warm-Up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one centered column (max 720px) with a progress strip on top; question, then feedback panel directly beneath it. Teacher view is a wider table layout behind a button. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --ink: #15302b;
  --muted: #556964;
  --line: #d3dedb;
  --accent: #0e7566;
  --accent-ink: #ffffff;
  --good: #1f7a3a;
  --good-bg: #e3f4e8;
  --bad: #a8431a;
  --bad-bg: #fbece3;
  --focus: #1a5fd0; --alt: #b4531a; --alt-ink: #ffffff;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1b19; --surface: #172826; --ink: #e5f0ed; --muted: #9db4ae; --line: #2c423e;
    --accent: #3fc2ad; --accent-ink: #072520; --good: #6fd68c; --good-bg: #17331f;
    --bad: #f0a27a; --bad-bg: #3a2418; --focus: #7ab0ff; --alt: #f0a27a; --alt-ink: #2a1408; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1b19; --surface: #172826; --ink: #e5f0ed; --muted: #9db4ae; --line: #2c423e;
  --accent: #3fc2ad; --accent-ink: #072520; --good: #6fd68c; --good-bg: #17331f;
  --bad: #f0a27a; --bad-bg: #3a2418; --focus: #7ab0ff; --alt: #f0a27a; --alt-ink: #2a1408; color-scheme: dark;
}
:root { --muted: #4d625d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --muted: #9db4ae; } }
:root[data-theme="dark"] { --muted: #9db4ae; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.wrap.wide { max-width: 1100px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.eyebrow { font-size: .8rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.target { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
input[type=text] { font: inherit; padding: 12px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pills input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pills label { min-width: 64px; padding: 10px 16px; text-align: center; border: 2px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--bg); font-weight: 700; user-select: none; }
.pills input:checked + label { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pills input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }

button { font: inherit; font-weight: 700; padding: 12px 20px; border-radius: 8px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.err { color: var(--bad); font-weight: 700; min-height: 1.4em; }

.progress { display: flex; gap: 6px; }
.progress span { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.progress span.cur { background: var(--accent); }
.progress span.ok { background: var(--good); }
.progress span.miss { background: var(--bad); }

.punnett { width: auto; font-size: 1.1rem; text-align: center; }
.punnett th, .punnett td { text-align: center; border: 1px solid var(--line); padding: 8px 16px; font-size: 1.1rem; text-transform: none; letter-spacing: 0; color: var(--ink); }
.punnett th { background: var(--bg); }
.ref { font-size: .85rem; color: var(--muted); font-weight: 700; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-weight: 400; }
.choice .mark { flex: none; width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 50%; margin-top: 1px; display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.choice.multi .mark { border-radius: 5px; }
.choice[aria-pressed="true"] { border-color: var(--accent); }
.choice[aria-pressed="true"] .mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.choice.locked { cursor: default; }
.choice.right { border-color: var(--good); background: var(--good-bg); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice.out { opacity: .55; }

.fb { border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 2px solid; }
.fb.good { background: var(--good-bg); border-color: var(--good); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); }
.fb .head { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.fb.good .head { color: var(--good); } .fb.bad .head { color: var(--bad); }
.fb ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.fb .keyidea { font-weight: 700; }

.big { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.score { font-family: var(--font-display); font-size: 4.5rem; font-weight: 800; line-height: 1; color: var(--accent); }
.score small { font-size: 1.4rem; color: var(--muted); font-weight: 600; }
.levels { display: grid; gap: 6px; }
.level { display: flex; gap: 10px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
.level b { flex: none; width: 1.4em; }
.level.you { border: 2px solid var(--accent); background: var(--surface); font-weight: 700; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: .95rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.num, th.num { text-align: right; }
.scroll { overflow-x: auto; max-width: 100%; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.grid2 > * { min-width: 0; }
.bar { display: flex; align-items: center; gap: 10px; }
.bar i { display: block; height: 14px; border-radius: 3px; background: var(--accent); }
.s4 { background: var(--good-bg); } .s1 { background: var(--bad-bg); }
.status { font-size: .95rem; color: var(--muted); }
.status.bad { color: var(--bad); font-weight: 700; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.react { border: 2px solid var(--accent); }
.rhead { color: var(--accent); }
.step, .sortrow { display: flex; flex-direction: column; gap: 8px; padding: 12px 0 4px; border-top: 1px solid var(--line); }
.stepq, .sorttext { margin: 0; }
.stepopts, .sortbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { background: var(--bg); color: var(--ink); border: 2px solid var(--line); font-weight: 400; padding: 10px 14px; text-align: left; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.x { border-color: var(--bad); background: var(--bad-bg); }
.stepfb { margin: 0; min-height: 1.2em; font-size: .95rem; }
.stepfb.good { color: var(--good); font-weight: 700; }
.stepfb.bad { color: var(--bad); font-weight: 700; }
.viz { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 12px; }
.cellrow, .chrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lab { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.lab.spc { margin-left: 16px; }
.chip { display: inline-grid; place-items: center; min-width: 40px; height: 40px; padding: 0 8px; border-radius: 8px; border: 2px solid var(--accent); font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; background: var(--surface); color: var(--ink); }
.chip.sc { border-color: var(--muted); }
button.chip.btn { cursor: pointer; }
button.chip.ok { border-color: var(--good); background: var(--good-bg); }
button.chip.x { border-color: var(--bad); background: var(--bad-bg); }
.listbox { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow: auto; }
.geno { font-family: var(--font-display); font-size: 1.2rem; }
.chroms { display: flex; gap: 28px; }
.chrom { display: flex; flex-direction: column; width: 72px; border-radius: 8px; overflow: hidden; border: 2px solid var(--line); }
.seg { height: 38px; display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); }
.seg.s1 { background: var(--accent); color: var(--accent-ink); }
.seg.s2 { background: var(--alt); color: var(--alt-ink); }
td.pcell { cursor: pointer; min-width: 64px; }
td.pcell.ok { background: var(--good-bg); }
td.pcell.x { background: var(--bad-bg); }
.rdone { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.sortbtns { flex-wrap: nowrap; }
.sortbtns .opt { flex: 1 1 0; min-width: 0; text-align: center; padding: 8px 6px; }
.sortrow { gap: 6px; padding-top: 10px; }

@media (prefers-reduced-motion: no-preference) { .fb { animation: rise .25s ease-out; } @keyframes rise { from { opacity: 0; transform: translateY(6px); } } }
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";
  var TARGET = "LS3-2.1";
  var TEACHERS = ["Renick", "Silva", "Bogner", "Leapley"];
  var PERIODS = [1, 2, 3, 5, 6, 7];

  // Question bank. "why" is the reteach for that specific wrong answer.
  var ITEMS = [
    { skill: "Name the three sources", ref: "Day 2 mini-lesson: Three sources of new variation", type: "single",
      text: "Scientists name three ways new genetic variation arises. Which list names all three?",
      key: "The three sources are (1) new combinations of alleles, (2) copying errors when DNA is copied, and (3) mutations from the environment, like UV light and some chemicals.",
      choices: [
        { t: "New combinations of alleles, errors when DNA is copied, and mutations from the environment", ok: true },
        { t: "New combinations of alleles, errors when DNA is copied, and a suntan from the sun", why: "A suntan changes how skin looks, but the change is not in the DNA, so it is not inherited." },
        { t: "Offspring getting information from only one parent, errors when DNA is copied, and UV light", why: "Every offspring gets information from both parents. That is not a source of variation." },
        { t: "The food an animal eats, the temperature, and the amount of sunlight", why: "Food, temperature, and sunlight can change how an animal looks, but not its DNA." }
      ],
      reteach: { sort: { prompt: "Sort each one. Is it a source of new variation in the DNA, or does it only change how a body looks?",
        buckets: ["Source of new variation", "Only changes the body"],
        cards: [
          { t: "Sex cells join at fertilization", b: 0, why: "Yes. This makes a new combination of alleles." },
          { t: "A rare error slips through when DNA is copied", b: 0, why: "Yes. A copying error changes the DNA." },
          { t: "UV light damages DNA", b: 0, why: "Yes. A mutation from the environment changes the DNA." },
          { t: "A suntan from the sun", b: 1, why: "A suntan changes how skin looks. It is not in the DNA, so it is not inherited." },
          { t: "Eating different food", b: 1, why: "Food can change how a body looks, but not the DNA." },
          { t: "Cold weather changes how fur looks", b: 1, why: "Temperature changes how a body looks, but not the DNA." }
        ] } } },

    { skill: "Match a case to a source", ref: "Day 1 puppy puzzle and Day 2 card activity", type: "single",
      text: "Mom and Dad are both Bb. They have puppies that are BB, Bb, and bb. Which source explains why the puppies are different from each other?",
      key: "Every allele in the puppies, B and b, was already in the parents. No allele changed. Fertilization put two alleles together in different combinations, so this is a new combination of alleles.",
      choices: [
        { t: "New combinations of alleles: each parent's sex cell carries one allele, and fertilization puts two together", ok: true },
        { t: "A copying error: a rare error slipped through when DNA was copied", why: "Copying errors are rare and make a new allele. These puppies have only B and b, which both parents already had." },
        { t: "A mutation from the environment: UV light damaged the DNA", why: "A mutation is a change in the DNA. No allele changed here. The puppies got different combinations of B and b." },
        { t: "The food and temperature changed the puppies' DNA", why: "Food and temperature do not change DNA. They cannot explain BB, Bb, and bb." }
      ],
      reteach: {
        viz: { type: "fertilize", p1: ["B", "b"], p2: ["B", "b"], who: "puppy", plural: "puppies", fixed: { 3: ["b", "B"] }, prompt: "Mom and Dad are both Bb. Each sex cell gets one allele. Make 4 puppies and watch which alleles show up." },
        steps: [
          { q: "Which alleles did your puppies have?", o: ["Only B and b, which the parents already had", "A new allele that neither parent has"], right: "Right. Every allele was already in a parent.", hints: { 1: "Look at the list again. Only B and b appear." } },
          { q: "Did any allele change into something different?", o: ["No, the alleles just got combined in different ways", "Yes, a copying error changed one"], right: "Right. Nothing changed. The alleles were combined in different ways.", hints: { 1: "A copying error would make a brand new allele. You only saw B and b." } },
          { q: "So which source explains BB, Bb, and bb?", o: ["New combinations of alleles", "Copying errors", "Mutations from the environment"], right: "New combinations of alleles.", hints: { 1: "A copying error would make a new allele.", 2: "UV light would damage DNA. Nothing was damaged here." } }
        ] } },

    { skill: "Which sources change the DNA", ref: "Day 2 mini-lesson: Three sources of new variation", type: "multi", pick: 2,
      text: "Two of the three sources of new variation change the DNA itself. Select the TWO.",
      key: "Copying errors and mutations from the environment both change the DNA. A change in how a body looks from food, exercise, or temperature is not in the DNA, so it is not inherited.",
      choices: [
        { t: "A rare error slips through when DNA is copied before a cell divides", ok: true },
        { t: "UV light or some chemicals damage DNA", ok: true },
        { t: "Food, exercise, or temperature change how a body looks", why: "That change is in how the body looks, not in the DNA, so it is not inherited." },
        { t: "A suntan from the sun", why: "A suntan changes how skin looks. It is not in the DNA, so it is not inherited." }
      ],
      reteach: { steps: [
        { q: "A suntan changes how skin looks. Is that change in the DNA?", o: ["No, it is only how the body looks", "Yes, the DNA is changed"], right: "Right. Food, exercise, and temperature work the same way.", hints: { 1: "A suntan is on the skin. The DNA is not changed, so it is not inherited." } },
        { q: "Which of these does change the DNA itself?", o: ["UV light damaging DNA", "Eating healthy food", "Exercise"], right: "UV light and some chemicals can damage DNA. That is a mutation.", hints: { 1: "Food changes how a body looks, not its DNA.", 2: "Exercise changes the body, not the DNA." } },
        { q: "A rare error when DNA is copied changes...", o: ["the DNA", "only how the body looks"], right: "The DNA. That is the second source of new variation.", hints: { 1: "A copying error is a mistake in the DNA itself." } }
      ] } }
  ];

  // 4-point scale from first-try correct answers out of 5.
  var LEVELS = [
    { n: 4, name: "Mastery", d: "You got all 3 right on the first try." },
    { n: 3, name: "Proficient", d: "2 of 3 right on the first try. This meets the class goal." },
    { n: 2, name: "Developing", d: "1 of 3 right on the first try. Review the notes below." },
    { n: 1, name: "Beginning", d: "0 of 3 right on the first try. Ask for help and review the notes below." }
  ];
  function toScale(c) { return c >= ITEMS.length ? 4 : c === ITEMS.length - 1 ? 3 : c >= 1 ? 2 : 1; }

  var app = document.getElementById("app");
  var db = null, userCap = null, dl = null, canEdit = false;
  var S = { who: { name: "", teacher: "", period: "" }, i: 0, order: [], sel: [], tries: 0, firstOk: [], finalOk: [], tryCount: [], saved: "idle", fbHtml: "" };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- start screen ---------- */
  function viewStart(err) {
    var saved = {}; try { saved = JSON.parse(lsGet("ls321who") || "{}"); } catch (e) {}
    var w = S.who.name ? S.who : saved;
    app.className = "wrap";
    app.innerHTML =
      '<div class="topbar"><span class="eyebrow">Unit 2.2 · Warm-up</span>' + (canEdit ? '<button class="ghost" id="tbtn">Teacher data</button>' : "") + "</div>" +
      "<h1>Three Sources of Variation</h1>" +
      '<div class="target"><b>Learning target ' + TARGET + ':</b> I can name three ways new genetic variation arises.</div>' +
      '<p>Answer 3 questions about Day 1 and Day 2 from memory. If you miss one, you get a quick activity to work it out, then a second try.</p>' +
      '<form class="card" id="f" novalidate>' +
      '<label class="field" for="nm">First and last name<input type="text" id="nm" autocomplete="off" value="' + esc(w.name || "") + '"></label>' +
      '<fieldset><legend>My teacher</legend><div class="pills" id="tp">' + TEACHERS.map(function (t) {
        return '<input type="radio" name="teacher" id="t_' + t + '" value="' + t + '"' + (w.teacher === t ? " checked" : "") + '><label for="t_' + t + '">' + t + "</label>"; }).join("") + "</div></fieldset>" +
      '<fieldset><legend>My period</legend><div class="pills" id="pp">' + PERIODS.map(function (p) {
        return '<input type="radio" name="period" id="p_' + p + '" value="' + p + '"' + (String(w.period) === String(p) ? " checked" : "") + '><label for="p_' + p + '">' + p + "</label>"; }).join("") + "</div></fieldset>" +
      '<div class="err" id="err" role="alert">' + esc(err || "") + '</div>' +
      '<div class="row"><button type="submit">Start</button></div></form>';
    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("nm").value.trim();
      var t = (document.querySelector('input[name=teacher]:checked') || {}).value;
      var p = (document.querySelector('input[name=period]:checked') || {}).value;
      if (name.length < 3 || name.indexOf(" ") < 0) return viewStart("Type your first and last name.");
      if (!t) return viewStart("Pick your teacher.");
      if (!p) return viewStart("Pick your period.");
      S.who = { name: name, teacher: t, period: p };
      lsSet("ls321who", JSON.stringify(S.who));
      S.i = 0; S.firstOk = []; S.finalOk = []; S.tryCount = []; S.saved = "idle";
      S.order = ITEMS.map(function (it) { return it.type === "tf" ? it.choices.map(function (_, k) { return k; }) : shuffle(it.choices.map(function (_, k) { return k; })); });
      beginQ();
    });
    var tb = document.getElementById("tbtn"); if (tb) tb.addEventListener("click", viewTeacher);
  }

  /* ---------- questions ---------- */
  function beginQ() { S.sel = []; S.tries = 0; S.out = []; S.fbHtml = ""; S.locked = false; S.state = "answer"; viewQ(); }

  function progressHtml() {
    return '<div class="progress" aria-label="Question ' + (S.i + 1) + ' of ' + ITEMS.length + '">' + ITEMS.map(function (_, k) {
      var c = k < S.i ? (S.firstOk[k] ? "ok" : "miss") : k === S.i ? "cur" : "";
      return "<span class=\"" + c + "\"></span>"; }).join("") + "</div>";
  }

  function gridHtml(it) {
    if (!it.grid) return "";
    return '<div class="scroll"><table class="punnett" aria-label="Punnett square">' + it.grid.map(function (r, ri) {
      return "<tr>" + r.map(function (c, ci) { return (ri === 0 || ci === 0 ? "<th>" : "<td>") + esc(c) + (ri === 0 || ci === 0 ? "</th>" : "</td>"); }).join("") + "</tr>"; }).join("") + "</table></div>";
  }

  function viewQ() {
    var it = ITEMS[S.i], multi = it.type === "multi";
    app.className = "wrap";
    var html = '<div class="topbar"><span class="eyebrow">Question ' + (S.i + 1) + " of " + ITEMS.length + "</span><span class=\"status\">" + esc(S.who.name) + "</span></div>" + progressHtml();
    html += '<div class="card"><span class="ref">Think back to: ' + esc(it.ref) + "</span><h2>" + esc(it.text) + "</h2>" + gridHtml(it) + (multi ? '<p class="status">Pick ' + it.pick + " answers.</p>" : "") + '<div class="choices" role="group" aria-label="Answer choices">';
    S.order[S.i].forEach(function (ci) {
      var c = it.choices[ci], pressed = S.sel.indexOf(ci) >= 0, cls = "choice" + (multi ? " multi" : "");
      var mark = "";
      if (S.locked) {
        cls += " locked";
        if (pressed && c.ok) { cls += " right"; mark = "✓"; }
        else if (pressed && !c.ok) { cls += " wrong"; mark = "✗"; }
        else if (S.state === "reveal" && c.ok) { cls += " right"; mark = "✓"; }
        else cls += " out";
      } else if (S.out.indexOf(ci) >= 0) { cls += " out"; }
      html += '<button type="button" class="' + cls + '" data-ci="' + ci + '" aria-pressed="' + pressed + '"' + (S.locked ? " disabled" : "") + '><span class="mark" aria-hidden="true">' + (mark || (pressed ? "✓" : "")) + "</span><span>" + esc(c.t) + "</span></button>";
    });
    html += "</div>";

  /* ---------- hands-on reteach engine ---------- */

  /* crossing over: swap the bottom pieces of paired chromosomes */

  function check() {
    var it = ITEMS[S.i];

    } else {
      var items = [];
      S.sel.forEach(function (ci) { var c = it.choices[ci]; if (!c.ok) items.push("<li><b>“" + esc(c.t) + "”</b> " + esc(c.why) + "</li>"); });

      }

        S.state = "reveal";

      '<div class="levels">' + LEVELS.map(function (l) { return '<div class="level' + (l.n === rec.score4 ? " you" : "") + '"><b>' + l.n + "</b><span>" + l.name + "</span></div>"; }).join("") + "</div></div>";

  function saveStatus(rec) {

  /* ---------- teacher data ---------- */
  var T = { rows: [], teacher: "All", period: "All", err: "" };
  function viewTeacher() {

  function keyOf(r) { return r._uid || [String(r.name).trim().toLowerCase(), r.teacher, r.period].join("|"); }
  function renderTeacher() {

    var shown = firsts.filter(function (r) { return (T.teacher === "All" || r.teacher === T.teacher) && (T.period === "All" || String(r.period) === String(T.period)); });
    function avg(a) { return a.length ? a.reduce(function (s, r) { return s + r.score4; }, 0) / a.length : null; }
    function f1(x) { return x === null ? "–" : x.toFixed(2); }
    function pct(n, d) { return d ? Math.round(100 * n / d) + "%" : "–"; }
    var html = '<div class="topbar"><div class="row"><div class="pills" id="ft">' + ["All"].concat(TEACHERS).map(function (t) { return '<input type="radio" name="ft" id="ft_' + t + '" value="' + t + '"' + (T.teacher === t ? " checked" : "") + '><label for="ft_' + t + '">' + t + "</label>"; }).join("") +
      '</div><div class="pills" id="fp">' + ["All"].concat(PERIODS).map(function (p) { return '<input type="radio" name="fp" id="fp_' + p + '" value="' + p + '"' + (String(T.period) === String(p) ? " checked" : "") + '><label for="fp_' + p + '">' + (p === "All" ? "All periods" : "P" + p) + "</label>"; }).join("") + "</div></div>" +
      '<div class="row"><button id="cc">Copy CSV</button><button class="ghost" id="dc">Download CSV</button></div></div>';
    html += '<p class="status">' + shown.length + " students shown (first attempt per student). " + (cur.length - firsts.length) + " repeat attempts are in the table but not in the averages." + (hiddenN ? " " + hiddenN + " rows from an earlier version of this warm-up are hidden." : "") + "</p>";

    // Distribution
    var dist = [4, 3, 2, 1].map(function (n) { return shown.filter(function (r) { return r.score4 === n; }).length; });
    var mx = Math.max.apply(null, dist.concat([1]));
    var tops = ["Mastery", "Proficient", "Developing", "Beginning"];
    html += '<div class="grid2"><div class="card"><h3>Scores on the 4-point scale</h3>' + dist.map(function (c, k) {
      return '<div class="bar"><span style="width:7.5em">' + (4 - k) + " " + tops[k] + '</span><i style="width:' + (c / mx * 60) + '%;min-width:' + (c ? 4 : 0) + 'px"></i><b>' + c + "</b></div>"; }).join("") +
      '<p class="status">Average ' + f1(avg(shown)) + " · at 3 or 4: " + pct(dist[0] + dist[1], shown.length) + "</p></div>";

    html += '<div class="card"><h3>Right on the first try, by question</h3>' + ITEMS.map(function (it, k) {
      var n = shown.filter(function (r) { return r.firstTry && r.firstTry[k] === 1; }).length;
      var p = shown.length ? n / shown.length * 100 : 0;
      return '<div class="bar"><span style="width:2.2em">Q' + (k + 1) + '</span><i style="width:' + (p * .6) + '%;min-width:' + (n ? 4 : 0) + 'px"></i><b>' + pct(n, shown.length) + '</b><span class="status">' + esc(it.skill) + "</span></div>"; }).join("") + "</div></div>";

    // Teacher x period
    var aTP = firsts;
    html += '<div class="card"><h3>Average score by teacher and period (first attempts)</h3><div class="scroll"><table><thead><tr><th>Teacher</th>' + PERIODS.map(function (p) { return '<th class="num">P' + p + "</th>"; }).join("") + '<th class="num">All</th></tr></thead><tbody>' +
      TEACHERS.map(function (t) {
        var tr = aTP.filter(function (r) { return r.teacher === t; });
        return "<tr><td><b>" + t + "</b></td>" + PERIODS.map(function (p) {
          var c = tr.filter(function (r) { return r.period === p; }); var a = avg(c);
          return '<td class="num ' + (a !== null ? (a >= 3 ? "s4" : a < 2 ? "s1" : "") : "") + '">' + f1(a) + (c.length ? ' <span class="status">(' + c.length + ")</span>" : "") + "</td>"; }).join("") +
          '<td class="num"><b>' + f1(avg(tr)) + "</b></td></tr>"; }).join("") +
      '<tr><td><b>All</b></td>' + PERIODS.map(function (p) { return '<td class="num">' + f1(avg(aTP.filter(function (r) { return r.period === p; }))) + "</td>"; }).join("") + '<td class="num"><b>' + f1(avg(aTP)) + "</b></td></tr></tbody></table></div></div>";

    // Student table
    var tbl = sorted.filter(function (r) { return (T.teacher === "All" || r.teacher === T.teacher) && (T.period === "All" || String(r.period) === String(T.period)); }).sort(function (a, b) { return a.teacher.localeCompare(b.teacher) || a.period - b.period || String(a.name).localeCompare(b.name); });
    html += '<div class="card"><h3>Students</h3><div class="scroll"><table><thead><tr><th>Teacher</th><th class="num">Per</th><th>Name</th><th class="num">Attempt</th><th class="num">Score (1–4)</th><th class="num">First-try right</th><th>First try by question</th></tr></thead><tbody>' +
      (tbl.length ? tbl.map(function (r) { return "<tr><td>" + esc(r.teacher) + '</td><td class="num">' + r.period + "</td><td>" + esc(r.name) + '</td><td class="num">' + r._attempt + '</td><td class="num ' + (r.score4 >= 3 ? "s4" : r.score4 < 2 ? "s1" : "") + '"><b>' + r.score4 + '</b></td><td class="num">' + r.firstTryCorrect + "/" + ITEMS.length + "</td><td>" + (r.firstTry || []).map(function (v) { return v ? "✓" : "✗"; }).join(" ") + "</td></tr>"; }).join("") : '<tr><td colspan="7">No responses yet.</td></tr>') + "</tbody></table></div></div>";
    app.innerHTML = '<div class="topbar"><h1>Teacher data</h1><div class="row"><button class="ghost" id="rf">Refresh</button><button class="ghost" id="bk">Back to warm-up</button></div></div>' + html;

    function csv() {
      var head = ["target", "teacher", "period", "name", "attempt", "score_4pt", "first_try_correct", "first_try_correct"].concat(ITEMS.map(function (_, k) { return "q" + (k + 1); }), ["final_correct", "timestamp"]);
      var lines = [head.join(",")].concat(tbl.map(function (r) {
        return [r.target, r.teacher, r.period, '"' + String(r.name).replace(/"/g, '""') + '"', r._attempt, r.score4, r.firstTryCorrect].concat(r.firstTry || [], [r.finalCorrect, new Date(r.ts).toISOString()]).join(","); }));
      return lines.join("\n");
    }
    document.getElementById("bk").addEventListener("click", function () { viewStart(); });
    document.getElementById("rf").addEventListener("click", viewTeacher);
    document.getElementById("cc").addEventListener("click", function () { try { navigator.clipboard.writeText(csv()).then(function () { document.getElementById("cc").textContent = "Copied"; }).catch(function () { document.getElementById("cc").textContent = "Copy blocked: use Download"; }); } catch (e) { document.getElementById("cc").textContent = "Copy blocked: use Download"; } });
    document.getElementById("dc").addEventListener("click", function () {
      if (!dl) { document.getElementById("dc").textContent = "Download not available"; return; }
      dl.save({ filename: "LS3-2.1-warmup-scores.csv", data: csv() }).catch(function () {});
    });
    document.querySelectorAll("#ft input").forEach(function (i) { i.addEventListener("change", function () { T.teacher = i.value; renderTeacher(); }); });
    document.querySelectorAll("#fp input").forEach(function (i) { i.addEventListener("change", function () { T.period = i.value; renderTeacher(); }); });
  }

  viewStart();
  if (window.claude && claude.use) {
    claude.use("db").then(function (d) { db = d; }).catch(function () {});
    claude.use("downloads").then(function (d) { dl = d; }).catch(function () {});
    claude.use("user").then(function (u) { userCap = u; if (u) return u.canEdit(); }).then(function (ce) {
      if (ce) { canEdit = true; if (document.getElementById("f")) viewStart(); }
    }).catch(function () {});
  }
})();
</script>
