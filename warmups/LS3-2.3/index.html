<title>Mutations Warm-Up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one centered column (max 720px) with a progress strip on top; question, then feedback panel directly beneath it. Teacher view is a wider table layout behind a button. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --ink: #15302b;
  --muted: #556964;
  --line: #d3dedb;
  --accent: #0e7566;
  --accent-ink: #ffffff;
  --good: #1f7a3a;
  --good-bg: #e3f4e8;
  --bad: #a8431a;
  --bad-bg: #fbece3;
  --focus: #1a5fd0; --alt: #b4531a; --alt-ink: #ffffff;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1b19; --surface: #172826; --ink: #e5f0ed; --muted: #9db4ae; --line: #2c423e;
    --accent: #3fc2ad; --accent-ink: #072520; --good: #6fd68c; --good-bg: #17331f;
    --bad: #f0a27a; --bad-bg: #3a2418; --focus: #7ab0ff; --alt: #f0a27a; --alt-ink: #2a1408; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1b19; --surface: #172826; --ink: #e5f0ed; --muted: #9db4ae; --line: #2c423e;
  --accent: #3fc2ad; --accent-ink: #072520; --good: #6fd68c; --good-bg: #17331f;
  --bad: #f0a27a; --bad-bg: #3a2418; --focus: #7ab0ff; --alt: #f0a27a; --alt-ink: #2a1408; color-scheme: dark;
}
:root { --muted: #4d625d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --muted: #9db4ae; } }
:root[data-theme="dark"] { --muted: #9db4ae; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.wrap.wide { max-width: 1100px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 800; }
h2 { font-size: 1.35rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.eyebrow { font-size: .8rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.target { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
input[type=text] { font: inherit; padding: 12px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { font-weight: 700; padding: 0; margin-bottom: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pills input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pills label { min-width: 64px; padding: 10px 16px; text-align: center; border: 2px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--bg); font-weight: 700; user-select: none; }
.pills input:checked + label { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pills input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }

button { font: inherit; font-weight: 700; padding: 12px 20px; border-radius: 8px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.err { color: var(--bad); font-weight: 700; min-height: 1.4em; }

.progress { display: flex; gap: 6px; }
.progress span { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.progress span.cur { background: var(--accent); }
.progress span.ok { background: var(--good); }
.progress span.miss { background: var(--bad); }

.punnett { width: auto; font-size: 1.1rem; text-align: center; }
.punnett th, .punnett td { text-align: center; border: 1px solid var(--line); padding: 8px 16px; font-size: 1.1rem; text-transform: none; letter-spacing: 0; color: var(--ink); }
.punnett th { background: var(--bg); }
.ref { font-size: .85rem; color: var(--muted); font-weight: 700; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-weight: 400; }
.choice .mark { flex: none; width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 50%; margin-top: 1px; display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.choice.multi .mark { border-radius: 5px; }
.choice[aria-pressed="true"] { border-color: var(--accent); }
.choice[aria-pressed="true"] .mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.choice.locked { cursor: default; }
.choice.right { border-color: var(--good); background: var(--good-bg); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice.out { opacity: .55; }

.fb { border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 2px solid; }
.fb.good { background: var(--good-bg); border-color: var(--good); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); }
.fb .head { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.fb.good .head { color: var(--good); } .fb.bad .head { color: var(--bad); }
.fb ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.fb .keyidea { font-weight: 700; }

.big { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.score { font-family: var(--font-display); font-size: 4.5rem; font-weight: 800; line-height: 1; color: var(--accent); }
.score small { font-size: 1.4rem; color: var(--muted); font-weight: 600; }
.levels { display: grid; gap: 6px; }
.level { display: flex; gap: 10px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
.level b { flex: none; width: 1.4em; }
.level.you { border: 2px solid var(--accent); background: var(--surface); font-weight: 700; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: .95rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.num, th.num { text-align: right; }
.scroll { overflow-x: auto; max-width: 100%; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.grid2 > * { min-width: 0; }
.bar { display: flex; align-items: center; gap: 10px; }
.bar i { display: block; height: 14px; border-radius: 3px; background: var(--accent); }
.s4 { background: var(--good-bg); } .s1 { background: var(--bad-bg); }
.status { font-size: .95rem; color: var(--muted); }
.status.bad { color: var(--bad); font-weight: 700; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.react { border: 2px solid var(--accent); }
.rhead { color: var(--accent); }
.step, .sortrow { display: flex; flex-direction: column; gap: 8px; padding: 12px 0 4px; border-top: 1px solid var(--line); }
.stepq, .sorttext { margin: 0; }
.stepopts, .sortbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { background: var(--bg); color: var(--ink); border: 2px solid var(--line); font-weight: 400; padding: 10px 14px; text-align: left; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.x { border-color: var(--bad); background: var(--bad-bg); }
.stepfb { margin: 0; min-height: 1.2em; font-size: .95rem; }
.stepfb.good { color: var(--good); font-weight: 700; }
.stepfb.bad { color: var(--bad); font-weight: 700; }
.viz { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 12px; }
.cellrow, .chrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lab { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.lab.spc { margin-left: 16px; }
.chip { display: inline-grid; place-items: center; min-width: 40px; height: 40px; padding: 0 8px; border-radius: 8px; border: 2px solid var(--accent); font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; background: var(--surface); color: var(--ink); }
.chip.sc { border-color: var(--muted); }
button.chip.btn { cursor: pointer; }
button.chip.ok { border-color: var(--good); background: var(--good-bg); }
button.chip.x { border-color: var(--bad); background: var(--bad-bg); }
.listbox { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow: auto; }
.geno { font-family: var(--font-display); font-size: 1.2rem; }
.chroms { display: flex; gap: 28px; }
.chrom { display: flex; flex-direction: column; width: 72px; border-radius: 8px; overflow: hidden; border: 2px solid var(--line); }
.seg { height: 38px; display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); }
.seg.s1 { background: var(--accent); color: var(--accent-ink); }
.seg.s2 { background: var(--alt); color: var(--alt-ink); }
td.pcell { cursor: pointer; min-width: 64px; }
td.pcell.ok { background: var(--good-bg); }
td.pcell.x { background: var(--bad-bg); }
.rdone { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.sortbtns { flex-wrap: nowrap; }
.sortbtns .opt { flex: 1 1 0; min-width: 0; text-align: center; padding: 8px 6px; }
.sortrow { gap: 6px; padding-top: 10px; }
.viz input[type=range] { width: 100%; accent-color: var(--accent); }
.dzlabels { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; color: var(--muted); font-weight: 700; }
.dzbar { height: 22px; background: var(--line); border-radius: 6px; overflow: hidden; }
.dzfill { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
@media (prefers-reduced-motion: reduce) { .dzfill { transition: none; } }
.punnett th, .punnett td { white-space: normal; padding: 8px 10px; }
.turnin textarea { width: 100%; min-height: 190px; font: inherit; font-size: .95rem; line-height: 1.4; padding: 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); resize: vertical; }
a.btnlink { display: inline-block; padding: 12px 20px; border-radius: 8px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; }
.turnin details { margin-top: 4px; }
.turnin summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.turnin .punnett { width: 100%; font-size: .95rem; }
.turnin .punnett th, .turnin .punnett td { padding: 6px 8px; font-size: .95rem; }

@media (prefers-reduced-motion: no-preference) { .fb { animation: rise .25s ease-out; } @keyframes rise { from { opacity: 0; transform: translateY(6px); } } }
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";
  var TARGET = "LS3-2.3";
  var TEACHER_PERIODS = { Renick: [5, 7], Silva: [1, 2, 3, 6, 7], Bogner: [1, 2, 3, 6, 7], Leapley: [7] };
  var TEACHERS = ["Renick", "Silva", "Bogner", "Leapley"];
  var PERIODS = [1, 2, 3, 5, 6, 7];
  function periodsFor(t) { return TEACHER_PERIODS[t] || []; }

  // Question bank. "why" is the reteach for that specific wrong answer.
  var ITEMS = [
    { skill: "What a copying error is", ref: "Day 7 mini-lesson: How do mutations happen?", type: "single",
      text: "Before a cell divides, it copies all of its DNA. Cells check the copy, and most copying errors are fixed. What is a rare copying error that stays?",
      key: "A rare copying error that is not fixed becomes a mutation. A mutation is a change in the DNA sequence.",
      choices: [
        { t: "A mutation, which is a change in the DNA sequence", ok: true },
        { t: "A new combination of alleles, made when a sperm and an egg join", why: "That is fertilization. A copying error is a mistake made when DNA is copied, so it changes the DNA itself." },
        { t: "A change that is always fixed later, so it never affects the DNA", why: "Cells fix most copying errors, but a rare one stays. The ones that stay are the mutations." },
        { t: "A change in how the body looks, like a suntan, that is not in the DNA", why: "A suntan is not in the DNA. A copying error that stays is a change in the DNA itself." }
      ],
      reteach: {
        viz: { type: "spot", orig: "ATGCCTAAG", copy: "ATGCCTTAG", prompt: "A cell is copying its DNA. Tap the one letter in the copy that does not match the original.", found: "That is the copying error. Cells check the copy and fix most errors, but a rare one stays." },
        steps: [
          { q: "A rare copying error that stays in the DNA is called a...", o: ["mutation", "new combination", "suntan"], right: "A mutation.", hints: { 1: "A new combination comes from fertilization, not from copying.", 2: "A suntan is not in the DNA." } },
          { q: "A mutation is a change in the...", o: ["DNA sequence", "way the body looks"], right: "The DNA sequence.", hints: { 1: "Changes in how a body looks are not mutations. A mutation is in the DNA." } }
        ] } },

    { skill: "Which change is inherited", ref: "Day 7 sort: Who passes it on? Five cases", type: "single",
      text: "In an animal, which change could the next generation inherit?",
      key: "In animals, a change is inherited only if it is in a cell that makes eggs or sperm. Skin, muscle, and lung cells are body cells.",
      choices: [
        { t: "A copying error in a cell that makes sperm", ok: true },
        { t: "UV light damages DNA in a skin cell", why: "Skin is a body cell. The change is not passed on, because the skin cell does not make eggs or sperm." },
        { t: "A copying error in a muscle cell of the leg", why: "Muscle is a body cell. A change in a body cell is not passed on, even when it is a real mutation." },
        { t: "Smoke damages DNA in a lung cell", why: "Lung is a body cell. Only a change in a cell that makes eggs or sperm can be passed on." }
      ],
      reteach: { sort: { prompt: "A mutation happens in each of these cells. Could the next generation inherit it?",
        buckets: ["Can be passed on", "Not passed on"],
        cards: [
          { t: "A skin cell", b: 1, why: "Skin is a body cell. The change is not passed on." },
          { t: "A muscle cell in the leg", b: 1, why: "Muscle is a body cell. The change is not passed on." },
          { t: "A lung cell", b: 1, why: "Lung is a body cell. The change is not passed on." },
          { t: "A cell that makes sperm", b: 0, why: "It makes sperm, so the change can be passed on." },
          { t: "A cell that makes eggs", b: 0, why: "It makes eggs, so the change can be passed on." }
        ] } } },

    { skill: "Why a one-letter change matters", ref: "Unit 2.1 and the Day 7 warm-up: GAG to GTG", type: "single",
      text: "In Unit 2.1, one DNA letter changed (GAG to GTG) and one amino acid changed (Glu to Val). Why might a one-letter mutation matter?",
      key: "A mutation changes the DNA sequence, and a different amino acid in a protein can make the protein work differently.",
      choices: [
        { t: "A different amino acid can make the protein work differently", ok: true },
        { t: "The protein is no longer made by any cell in the body", why: "In the Glu to Val example, the protein was still made. One amino acid was different." },
        { t: "Every other gene in the cell changes in the same way", why: "A mutation changes the DNA only where it happens. The other genes stay the same." },
        { t: "The mutation is copied into every cell of the body right away", why: "A mutation is in the cell where it happened, and in copies of that cell. It does not spread to every cell." }
      ],
      reteach: {
        viz: { type: "codon", before: "GAG", aa1: "Glu", after: "GTG", aa2: "Val", prompt: "This is the DNA letter code from Unit 2.1. Change one letter and watch the amino acid." },
        steps: [
          { q: "When one letter changed, what changed in the protein?", o: ["One amino acid (Glu became Val)", "Every amino acid", "Nothing changed"], right: "One amino acid changed.", hints: { 1: "Only the one amino acid for that spot changed.", 2: "Look at the amino acid line. It changed from Glu to Val." } },
          { q: "Can a different amino acid change how the protein works?", o: ["Yes, so one letter can matter", "No, a protein always works the same"], right: "Yes. That is why one letter can matter.", hints: { 1: "A different amino acid can change the protein's shape and how it works." } }
        ] } }
  ];

  // 4-point scale from first-try correct answers out of 5.
  var LEVELS = [
    { n: 4, name: "Mastery", d: "You got all 3 right on the first try." },
    { n: 3, name: "Proficient", d: "2 of 3 right on the first try. This meets the class goal." },
    { n: 2, name: "Developing", d: "1 of 3 right on the first try. Review the notes below." },
    { n: 1, name: "Beginning", d: "0 of 3 right on the first try. Ask for help and review the notes below." }
  ];
  function toScale(c) { return c >= ITEMS.length ? 4 : c === ITEMS.length - 1 ? 3 : c >= 1 ? 2 : 1; }

  var app = document.getElementById("app");
  var db = null, userCap = null, dl = null, canEdit = false;
  var S = { who: { name: "", teacher: "", period: "" }, i: 0, order: [], sel: [], tries: 0, firstOk: [], finalOk: [], tryCount: [], saved: "idle", fbHtml: "" };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- start screen ---------- */
  function viewStart(err) {
    var saved = {}; try { saved = JSON.parse(lsGet("ls323who") || "{}"); } catch (e) {}
    var w = S.draft || (S.who.name ? S.who : saved);
    if (w.name && !/^\d{6}$/.test(String(w.name))) w = { name: "", teacher: w.teacher, period: w.period };
    if (w.teacher && periodsFor(w.teacher).indexOf(Number(w.period)) < 0) w = { name: w.name, teacher: w.teacher, period: null };
    app.className = "wrap";
    app.innerHTML =
      '<div class="topbar"><span class="eyebrow">Unit 2.2 · Warm-up</span>' + (canEdit ? '<button class="ghost" id="tbtn">Teacher data</button>' : "") + "</div>" +
      "<h1>Copying Errors and Mutations</h1>" +
      '<div class="target"><b>Learning target ' + TARGET + ':</b> I can explain how copying errors and things like UV light change genes, and when that change is inherited.</div>' +
      '<p>Answer 3 questions about Day 7 from memory. If you miss one, you get a quick activity to work it out, then a second try.</p>' +
      '<form class="card" id="f" novalidate>' +
      '<label class="field" for="nm">Your 6-digit student ID<input type="text" id="nm" inputmode="numeric" maxlength="6" autocomplete="off" value="' + esc(w.name || "") + '"></label>' +
      '<fieldset><legend>My teacher</legend><div class="pills" id="tp">' + TEACHERS.map(function (t) {
        return '<input type="radio" name="teacher" id="t_' + t + '" value="' + t + '"' + (w.teacher === t ? " checked" : "") + '><label for="t_' + t + '">' + t + "</label>"; }).join("") + "</div></fieldset>" +
      '<fieldset><legend>My period</legend><div class="pills" id="pp"></div></fieldset>' +
      '<div class="err" id="err" role="alert">' + esc(err || "") + '</div>' +
      '<div class="row"><button type="submit">Start</button></div></form>';
    function drawPeriods(t, chosen) {
      var pp = document.getElementById("pp"), list = periodsFor(t);
      if (!list.length) { pp.innerHTML = '<span class="status">Pick your teacher first.</span>'; return; }
      pp.innerHTML = list.map(function (p) {
        return '<input type="radio" name="period" id="p_' + p + '" value="' + p + '"' + (String(chosen) === String(p) ? " checked" : "") + '><label for="p_' + p + '">' + p + "</label>"; }).join("");
    }
    drawPeriods(w.teacher, w.period);
    document.querySelectorAll('input[name=teacher]').forEach(function (r) { r.addEventListener("change", function () { drawPeriods(r.value, null); }); });
    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("nm").value.trim();
      var t = (document.querySelector('input[name=teacher]:checked') || {}).value;
      var p = (document.querySelector('input[name=period]:checked') || {}).value;
      function fail(msg) { S.draft = { name: name, teacher: t || null, period: p || null }; viewStart(msg); }
      if (!/^\d{6}$/.test(name)) return fail("Type your 6-digit student ID. It is 6 numbers.");
      if (!t) return fail("Pick your teacher.");
      if (!p || periodsFor(t).indexOf(Number(p)) < 0) return fail("Pick your period.");
      S.draft = null; S.who = { name: name, teacher: t, period: p };
      lsSet("ls323who", JSON.stringify(S.who));
      S.i = 0; S.firstOk = []; S.finalOk = []; S.tryCount = []; S.saved = "idle";
      S.order = ITEMS.map(function (it) { return it.type === "tf" ? it.choices.map(function (_, k) { return k; }) : shuffle(it.choices.map(function (_, k) { return k; })); });
      beginQ();
    });
    var tb = document.getElementById("tbtn"); if (tb) tb.addEventListener("click", viewTeacher);
  }

  /* ---------- questions ---------- */
  function beginQ() { S.sel = []; S.tries = 0; S.out = []; S.fbHtml = ""; S.locked = false; S.state = "answer"; viewQ(); }

  function progressHtml() {
    return '<div class="progress" aria-label="Question ' + (S.i + 1) + ' of ' + ITEMS.length + '">' + ITEMS.map(function (_, k) {
      var c = k < S.i ? (S.firstOk[k] ? "ok" : "miss") : k === S.i ? "cur" : "";
      return "<span class=\"" + c + "\"></span>"; }).join("") + "</div>";
  }

  function gridHtml(it) {
    if (!it.grid) return "";

    var line = [when, TARGET, rec.teacher, rec.period, String(rec.name).replace(/[\t\r\n]+/g, " "), rec.score4, rec.firstTryCorrect, ft[0], ft[1], ft[2]].join("\t");
    var full = buildBlock(rec);
    el.innerHTML = '<h2>Turn in your results</h2>' +
      '<p><b>Step 1.</b> Copy your results.</p>' +
      '<div class="row"><button type="button" id="cpb">Copy my results</button><span class="status" id="cps" aria-live="polite"></span></div>' +
      '<textarea id="tl" rows="2" readonly hidden aria-label="Your results line"></textarea>' +
      '<div class="scroll"><table class="punnett"><tr><th>Warm-up</th><th>Teacher</th><th>Period</th><th>Student ID</th><th>Score</th></tr><tr><td>' + esc(TARGET) + "</td><td>" + esc(rec.teacher) + "</td><td>" + esc(rec.period) + "</td><td>" + esc(rec.name) + "</td><td>" + rec.score4 + " of 4</td></tr></table></div>" +
      '<p><b>Step 2.</b> Open your teacher\'s class sheet. The yellow banner at the top tells you which row to paste in. Click the box in column A of that row. Then paste (Ctrl+V).</p>' +
      '<div class="row"><a class="btnlink" href="' + pasteUrl(rec.teacher) + '" target="_blank" rel="noopener">Open the class sheet</a></div>' +
      '<p class="status">Check that your ID and score show up in the row you pasted.</p>' +
      '<details><summary>Need the full text for Canvas instead?</summary><textarea id="tx" readonly rows="10" aria-label="Your full results"></textarea><div class="row"><button type="button" class="ghost" id="cpf">Copy the full text</button><span class="status" id="cpm" aria-live="polite"></span></div></details>';
    var ta = document.getElementById("tx"); ta.value = full;
    document.getElementById("cpb").addEventListener("click", function () { copyWithFallback(line, document.getElementById("tl"), document.getElementById("cps"), "Copied. Now open the class sheet and paste."); });
    document.getElementById("cpf").addEventListener("click", function () { copyWithFallback(full, ta, document.getElementById("cpm"), "Copied the full text."); });
  }
  function saveStatus(rec) {
    var el = document.getElementById("sv"); if (!el) return;
    if (S.saved === "ok") el.innerHTML = '<p class="status">Your score was also saved for your teacher.</p>';
    else if (S.saved === "saving") el.innerHTML = '<p class="status">Saving your score…</p>';
    else {
      el.innerHTML = '<p class="status bad">Your score could not be saved automatically. Turn it in using the box above.</p><p class="status">Reason: ' + esc(S.why || "unknown") + '.</p>' +
        '<div class="row"><button type="button" class="ghost" id="rs">Try saving again</button></div>';
      document.getElementById("rs").addEventListener("click", function () { save(rec); });
    }
  }
  function save(rec) {
    S.saved = "saving"; saveStatus(rec);
    if (!db || !userCap) {
      S.why = !(window.claude && claude.use) ? "the page was not opened inside claude.ai" : !db ? "this device is not signed in to claude.ai, so the saving service is unavailable" : "this device is not signed in to claude.ai";
      S.saved = "fail"; return saveStatus(rec);
    }
    var t = setTimeout(function () { if (S.saved === "saving") { S.why = "the saving service did not answer in time"; S.saved = "fail"; saveStatus(rec); } }, 12000);
    userCap.id().then(function (id) {
      var ref = db.doc("responses/" + id);
      return ref.get().then(function (snap) {
        var old = snap.exists && snap.data() && snap.data().attempts ? snap.data().attempts : [];
        return ref.set({ attempts: old.concat([rec]) });
      });
    }).then(function () { clearTimeout(t); S.saved = "ok"; saveStatus(rec); })
      .catch(function (e) { clearTimeout(t); S.why = "the saving service refused it (" + (e && e.code ? e.code : "unknown error") + ")"; S.saved = "fail"; saveStatus(rec); });
  }

  /* ---------- teacher data ---------- */
  var T = { rows: [], teacher: "All", period: "All", err: "" };
  function viewTeacher() {
    app.className = "wrap wide";
    app.innerHTML = '<div class="topbar"><h1>Teacher data</h1><div class="row"><button class="ghost" id="rf">Refresh</button><button class="ghost" id="bk">Back to warm-up</button></div></div><p class="status" id="ld">Loading responses…</p>';
    document.getElementById("bk").addEventListener("click", function () { viewStart(); });
    document.getElementById("rf").addEventListener("click", viewTeacher);
    if (!db) { document.getElementById("ld").textContent = "Saved data is not available in this view. Sign in to claude.ai with the account that owns this page."; return; }
    load();
  }
  function load() {
    var ld = document.getElementById("ld"); if (!ld) return;
    ld.className = "status"; ld.textContent = "Loading responses…";
    db.collection("responses").get().then(function (snap) {
      T.rows = []; snap.docs.forEach(function (d) { var x = d.data(); (x && x.attempts || []).forEach(function (a) { var c = {}; Object.keys(a).forEach(function (k) { c[k] = a[k]; }); c._uid = d.id; T.rows.push(c); }); });
      try { renderTeacher(); } catch (e) { loadFail(e, "Could not display the results"); }
    }).catch(function (e) { loadFail(e, "Could not load responses"); });
  }
  function loadFail(e, head) {
    var ld = document.getElementById("ld"); if (!ld) return;
    var code = e && e.code ? e.code : "error", msg = e && e.message ? e.message : "";
    var hint = code === "not_granted" ? "This view has not allowed the page to use saved data. Choose Allow access." : "Choose Try again. If it keeps happening, make sure you are signed in with the account that owns this page.";
    ld.className = "status bad";
    ld.innerHTML = esc(head) + " (" + esc(code) + (msg ? ": " + esc(msg) : "") + "). " + esc(hint) +
      '<span class="row"><button type="button" id="rl">Try again</button><button type="button" class="ghost" id="ra2">Allow access</button><button type="button" class="ghost" id="rm">Open permissions</button></span>';
    document.getElementById("rl").addEventListener("click", load);
    document.getElementById("ra2").addEventListener("click", function () {
      claude.use("permissions").then(function (p) { return p ? p.request(["db"]) : null; }).then(load).catch(load);
    });
    document.getElementById("rm").addEventListener("click", function () {
      claude.use("permissions").then(function (p) { return p ? p.manage() : null; }).then(load).catch(function () {
        var l2 = document.getElementById("ld"); if (l2) l2.insertAdjacentText("beforeend", " Open this page's Permissions menu from the top bar.");
      });
    });
  }
  /* ---------- Google Sheet sync (run by a teacher with edit access) ---------- */
  var SHEET_ID = "10WroyFp_Aw3bb_46aYoXDjT3uv7DEZ3Uho-5qGnW4dc", SHEET_SERVER = "Google Sheets";
  var SHEET_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit";
  function sheetRows() {
    var cur = T.rows.filter(function (r) { return r.nq === ITEMS.length; }).sort(function (a, b) { return a.ts - b.ts; }), seen = {};
    return cur.map(function (r) {
      var k = r._uid || r.name, ft = r.firstTry || []; seen[k] = (seen[k] || 0) + 1;
      var row = [new Date(r.ts).toLocaleString("sv-SE", { timeZone: "America/Los_Angeles" }).slice(0, 16), TARGET, r.teacher, r.period, r.name, seen[k], r.score4, r.firstTryCorrect, ITEMS.length];
      for (var i = 0; i < 3; i++) row.push(ft[i] === undefined ? "" : ft[i]);
      row.push(r.finalCorrect, r._uid || "");
      return row;
    });
  }
  function sendToSheet(btn, out) {
    var mine = sheetRows();
    out.className = "status"; out.textContent = "Sending to Google Sheet…"; btn.disabled = true;
    var usable = window.claude && claude.use ? claude.use("mcp") : Promise.resolve(null);
    usable.then(function (mcp) {
      if (!mcp) throw { code: "unavailable", message: "Google Sheets is not available in this view." };
      return mcp.callTool(SHEET_SERVER, "get_values", { spreadsheetId: SHEET_ID, range: "Scores!A2:N" }).then(function (res) {
        var old = (res.payload && res.payload.values) || [];
        var all = old.filter(function (r) { return r[1] && r[1] !== TARGET; }).concat(mine);
        all.sort(function (a, b) { return String(a[1]).localeCompare(String(b[1])); });
        var blanks = Math.max(0, old.length - all.length);
        for (var i = 0; i < blanks; i++) all.push([]);
        all = all.map(function (r) { r = r.slice(); while (r.length < 14) r.push(""); return r; });
        if (!all.length) return 0;
        return mcp.callTool(SHEET_SERVER, "update_values", { spreadsheetId: SHEET_ID, range: "Scores!A2:N" + (all.length + 1), values: all }).then(function () { return mine.length; });
      });
    }).then(function (n) {
      out.className = "status"; out.innerHTML = "Sent " + n + " rows for " + esc(TARGET) + " to the sheet. <a href=\"" + SHEET_URL + "\" target=\"_blank\" rel=\"noopener\">Open the sheet</a>";
    }).catch(function (e) { sheetFail(out, e); }).then(function () { btn.disabled = false; });
  }
  function sheetFail(out, e) {
    var c = e && e.code ? e.code : "error", m = e && e.message ? e.message : "", t;
    if (c === "server_not_connected" || c === "server_not_found") t = "Google Sheets is not connected for your account. Add it in claude.ai Settings, then Connectors, and try again.";
    else if (c === "needs_reauth") t = "Reconnect Google Sheets in claude.ai Settings, then Connectors, and try again.";
    else if (c === "approval_required") t = "Google Sheets needs your approval. Choose Send to Google Sheet again and allow it.";
    else if (c === "not_in_manifest") t = "This page is not allowed to use Google Sheets for you. Turn it on in this page's Permissions menu.";
    else if (c === "blocked_by_policy") t = "Your organization blocks this connection.";
    else if (c === "tool_error") t = "Google Sheets reported a problem. Check that the sheet is shared with your Google account with edit access. " + m;
    else t = "Could not reach Google Sheets (" + c + (m ? ": " + m : "") + "). Try again in a minute.";
    out.className = "status bad"; out.textContent = t;
  }
  function keyOf(r) { return r._uid || [String(r.name).trim().toLowerCase(), r.teacher, r.period].join("|"); }
  function renderTeacher() {
    var cur = T.rows.filter(function (r) { return r.nq === ITEMS.length; });
    var hiddenN = T.rows.length - cur.length;
    var sorted = cur.slice().sort(function (a, b) { return a.ts - b.ts; });
    var seen = {};
    sorted.forEach(function (r) { var k = keyOf(r); seen[k] = (seen[k] || 0) + 1; r._attempt = seen[k]; });
    var firsts = sorted.filter(function (r) { return r._attempt === 1; });
    var shown = firsts.filter(function (r) { return (T.teacher === "All" || r.teacher === T.teacher) && (T.period === "All" || String(r.period) === String(T.period)); });
    function avg(a) { return a.length ? a.reduce(function (s, r) { return s + r.score4; }, 0) / a.length : null; }
    function f1(x) { return x === null ? "–" : x.toFixed(2); }
    function pct(n, d) { return d ? Math.round(100 * n / d) + "%" : "–"; }
    var html = '<div class="topbar"><div class="row"><div class="pills" id="ft">' + ["All"].concat(TEACHERS).map(function (t) { return '<input type="radio" name="ft" id="ft_' + t + '" value="' + t + '"' + (T.teacher === t ? " checked" : "") + '><label for="ft_' + t + '">' + t + "</label>"; }).join("") +
      '</div><div class="pills" id="fp">' + ["All"].concat(T.teacher === "All" ? PERIODS : periodsFor(T.teacher)).map(function (p) { return '<input type="radio" name="fp" id="fp_' + p + '" value="' + p + '"' + (String(T.period) === String(p) ? " checked" : "") + '><label for="fp_' + p + '">' + (p === "All" ? "All periods" : "P" + p) + "</label>"; }).join("") + "</div></div>" +
      '<div class="row"><button id="cc">Copy CSV</button><button class="ghost" id="dc">Download CSV</button><button class="ghost" id="sh">Send to Google Sheet</button></div></div>';
    html += '<p class="status" id="shs" aria-live="polite"></p><p class="status">' + shown.length + " students shown (first attempt per student). " + (cur.length - firsts.length) + " repeat attempts are in the table but not in the averages." + (hiddenN ? " " + hiddenN + " rows from an earlier version of this warm-up are hidden." : "") + "</p>";

    // Distribution
    var dist = [4, 3, 2, 1].map(function (n) { return shown.filter(function (r) { return r.score4 === n; }).length; });
    var mx = Math.max.apply(null, dist.concat([1]));
    var tops = ["Mastery", "Proficient", "Developing", "Beginning"];
    html += '<div class="grid2"><div class="card"><h3>Scores on the 4-point scale</h3>' + dist.map(function (c, k) {
      return '<div class="bar"><span style="width:7.5em">' + (4 - k) + " " + tops[k] + '</span><i style="width:' + (c / mx * 60) + '%;min-width:' + (c ? 4 : 0) + 'px"></i><b>' + c + "</b></div>"; }).join("") +
      '<p class="status">Average ' + f1(avg(shown)) + " · at 3 or 4: " + pct(dist[0] + dist[1], shown.length) + "</p></div>";

    // Per-question
    html += '<div class="card"><h3>Right on the first try, by question</h3>' + ITEMS.map(function (it, k) {
      var n = shown.filter(function (r) { return r.firstTry && r.firstTry[k] === 1; }).length;
      var p = shown.length ? n / shown.length * 100 : 0;
      return '<div class="bar"><span style="width:2.2em">Q' + (k + 1) + '</span><i style="width:' + (p * .6) + '%;min-width:' + (n ? 4 : 0) + 'px"></i><b>' + pct(n, shown.length) + '</b><span class="status">' + esc(it.skill) + "</span></div>"; }).join("") + "</div></div>";

    // Teacher x period
    var aTP = firsts;
    html += '<div class="card"><h3>Average score by teacher and period (first attempts)</h3><div class="scroll"><table><thead><tr><th>Teacher</th>' + PERIODS.map(function (p) { return '<th class="num">P' + p + "</th>"; }).join("") + '<th class="num">All</th></tr></thead><tbody>' +
      TEACHERS.map(function (t) {
        var tr = aTP.filter(function (r) { return r.teacher === t; });
        return "<tr><td><b>" + t + "</b></td>" + PERIODS.map(function (p) {
          if (periodsFor(t).indexOf(p) < 0) return '<td class="num"></td>';
          var c = tr.filter(function (r) { return r.period === p; }); var a = avg(c);
          return '<td class="num ' + (a !== null ? (a >= 3 ? "s4" : a < 2 ? "s1" : "") : "") + '">' + f1(a) + (c.length ? ' <span class="status">(' + c.length + ")</span>" : "") + "</td>"; }).join("") +
          '<td class="num"><b>' + f1(avg(tr)) + "</b></td></tr>"; }).join("") +
      '<tr><td><b>All</b></td>' + PERIODS.map(function (p) { return '<td class="num">' + f1(avg(aTP.filter(function (r) { return r.period === p; }))) + "</td>"; }).join("") + '<td class="num"><b>' + f1(avg(aTP)) + "</b></td></tr></tbody></table></div></div>";

    // Student table
    var tbl = sorted.filter(function (r) { return (T.teacher === "All" || r.teacher === T.teacher) && (T.period === "All" || String(r.period) === String(T.period)); }).sort(function (a, b) { return a.teacher.localeCompare(b.teacher) || a.period - b.period || String(a.name).localeCompare(b.name); });
    html += '<div class="card"><h3>Students</h3><div class="scroll"><table><thead><tr><th>Teacher</th><th class="num">Per</th><th>Student ID</th><th class="num">Attempt</th><th class="num">Score (1–4)</th><th class="num">First-try right</th><th>First try by question</th></tr></thead><tbody>' +
      (tbl.length ? tbl.map(function (r) { return "<tr><td>" + esc(r.teacher) + '</td><td class="num">' + r.period + "</td><td>" + esc(r.name) + '</td><td class="num">' + r._attempt + '</td><td class="num ' + (r.score4 >= 3 ? "s4" : r.score4 < 2 ? "s1" : "") + '"><b>' + r.score4 + '</b></td><td class="num">' + r.firstTryCorrect + "/" + ITEMS.length + "</td><td>" + (r.firstTry || []).map(function (v) { return v ? "✓" : "✗"; }).join(" ") + "</td></tr>"; }).join("") : '<tr><td colspan="7">No responses yet.</td></tr>') + "</tbody></table></div></div>";
    app.innerHTML = '<div class="topbar"><h1>Teacher data</h1><div class="row"><button class="ghost" id="rf">Refresh</button><button class="ghost" id="bk">Back to warm-up</button></div></div>' + html;

    function csv() {
      var head = ["target", "teacher", "period", "student_id", "attempt", "score_4pt", "first_try_correct"].concat(ITEMS.map(function (_, k) { return "q" + (k + 1); }), ["final_correct", "timestamp"]);
      var lines = [head.join(",")].concat(tbl.map(function (r) {
        return [r.target, r.teacher, r.period, '"' + String(r.name).replace(/"/g, '""') + '"', r._attempt, r.score4, r.firstTryCorrect].concat(r.firstTry || [], [r.finalCorrect, new Date(r.ts).toISOString()]).join(","); }));
      return lines.join("\n");
    }
    document.getElementById("bk").addEventListener("click", function () { viewStart(); });
    document.getElementById("rf").addEventListener("click", viewTeacher);
    document.getElementById("cc").addEventListener("click", function () { try { navigator.clipboard.writeText(csv()).then(function () { document.getElementById("cc").textContent = "Copied"; }).catch(function () { document.getElementById("cc").textContent = "Copy blocked: use Download"; }); } catch (e) { document.getElementById("cc").textContent = "Copy blocked: use Download"; } });
    document.getElementById("dc").addEventListener("click", function () {
      if (!dl) { document.getElementById("dc").textContent = "Download not available"; return; }
      dl.save({ filename: "LS3-2.3-warmup-scores.csv", data: csv() }).catch(function () {});
    });
    document.getElementById("sh").addEventListener("click", function () { sendToSheet(document.getElementById("sh"), document.getElementById("shs")); });
    document.querySelectorAll("#ft input").forEach(function (i) { i.addEventListener("change", function () { T.teacher = i.value; if (T.period !== "All" && T.teacher !== "All" && periodsFor(T.teacher).indexOf(Number(T.period)) < 0) T.period = "All"; renderTeacher(); }); });
    document.querySelectorAll("#fp input").forEach(function (i) { i.addEventListener("change", function () { T.period = i.value; renderTeacher(); }); });
  }

  viewStart();
  if (window.claude && claude.use) {
    claude.use("db").then(function (d) { db = d; }).catch(function () {});
    claude.use("downloads").then(function (d) { dl = d; }).catch(function () {});
    claude.use("user").then(function (u) { userCap = u; if (u) return u.canEdit(); }).then(function (ce) {
      if (ce) { canEdit = true; if (document.getElementById("f")) viewStart(); }
    }).catch(function () {});
  }
})();
</script>
